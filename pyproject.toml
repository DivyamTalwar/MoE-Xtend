[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moe-xtend"
version = "0.1.0"
description = "Clarity-first gpt-oss MoE inference and long-context research runtime"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "torch>=2.2.0",
  "huggingface_hub>=0.24.0",
  "safetensors>=0.4.0",
  "numpy>=1.24.0",
  "einops>=0.8.0",
  "openai-harmony",
  "jsonschema>=4.22.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
gpu = ["triton>=3.0.0"]

[project.scripts]
moe-xtend = "inference:main"
moe-xtend-server = "server:main"

[tool.setuptools]
py-modules = ["model", "weights", "sampling", "prompting", "inference", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
